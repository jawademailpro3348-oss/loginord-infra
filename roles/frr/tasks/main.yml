---
- name: Paquet FRR
  ansible.builtin.apt:
    name: frr
    state: present

- name: Activer le démon OSPF
  ansible.builtin.lineinfile:
    path: /etc/frr/daemons
    regexp: '^ospfd='
    line: 'ospfd=yes'
  notify: Redémarrer frr

- name: Configuration FRR
  ansible.builtin.template:
    src: frr.conf.j2
    dest: /etc/frr/frr.conf
    owner: frr
    group: frr
    mode: "0640"
  notify: Redémarrer frr

- name: Service FRR démarré
  ansible.builtin.service:
    name: frr
    state: started
    enabled: true
