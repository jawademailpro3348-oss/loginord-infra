<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="LogiNord, infrastructure multi-site Linux et Windows en Ansible">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#132a4a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="card"><rect width="1280" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect x="0" y="312" width="1280" height="8" fill="#ee0000" opacity="0.85"/>
  </g>

  <!-- Texte -->
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="64" y="128" font-size="76" font-weight="700" fill="#ffffff" letter-spacing="1">LogiNord</text>
    <text x="66" y="172" font-size="25" fill="#a9b8d4">Infrastructure multi-site Linux et Windows</text>
    <text x="66" y="204" font-size="25" fill="#a9b8d4">décrite en code avec Ansible</text>
  </g>
  <g font-family="Consolas, Menlo, DejaVu Sans Mono, monospace" font-size="20">
    <rect x="64" y="234" width="470" height="44" rx="8" fill="#000000" fill-opacity="0.35" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="82" y="262" fill="#3fb950">$</text>
    <text x="102" y="262" fill="#e6edf3">ansible-playbook site.yml</text>
    <rect x="420" y="245" width="100" height="24" rx="12" fill="#3fb950" fill-opacity="0.18"/>
    <text x="470" y="262" fill="#3fb950" font-size="15" text-anchor="middle">changed=0</text>
  </g>

  <!-- Schéma des deux sites -->
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
    <!-- Site A -->
    <rect x="640" y="62" width="250" height="196" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#38bdf8" stroke-opacity="0.35"/>
    <text x="662" y="92" font-size="16" font-weight="600" fill="#7dd3fc" letter-spacing="2">SITE A</text>
    <!-- Site B -->
    <rect x="990" y="62" width="250" height="196" rx="16" fill="#ffffff" fill-opacity="0.04" stroke="#38bdf8" stroke-opacity="0.35"/>
    <text x="1012" y="92" font-size="16" font-weight="600" fill="#7dd3fc" letter-spacing="2">SITE B</text>

    <!-- Tunnel -->
    <ellipse cx="940" cy="168" rx="70" ry="26" fill="url(#glow)"/>
    <line x1="822" y1="168" x2="1058" y2="168" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.35" filter="url(#soft)"/>
    <line x1="822" y1="168" x2="1058" y2="168" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="10 7"/>
    <text x="940" y="150" font-size="14" fill="#e6edf3" text-anchor="middle">WireGuard</text>
    <text x="940" y="200" font-size="14" fill="#a9b8d4" text-anchor="middle">OSPF</text>

    <!-- Routeurs -->
    <circle cx="800" cy="168" r="24" fill="#0f2742" stroke="#38bdf8" stroke-width="2.5"/>
    <path d="M788 168h24M800 156v24" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"/>
    <text x="800" y="214" font-size="14" fill="#e6edf3" text-anchor="middle">rtr-a</text>
    <circle cx="1080" cy="168" r="24" fill="#0f2742" stroke="#38bdf8" stroke-width="2.5"/>
    <path d="M1068 168h24M1080 156v24" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"/>
    <text x="1080" y="214" font-size="14" fill="#e6edf3" text-anchor="middle">rtr-b</text>

    <!-- Clients et serveurs -->
    <line x1="700" y1="168" x2="776" y2="168" stroke="#a9b8d4" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="664" y="150" width="36" height="36" rx="7" fill="#1b3354" stroke="#a9b8d4" stroke-opacity="0.7"/>
    <text x="682" y="214" font-size="14" fill="#a9b8d4" text-anchor="middle">client-a</text>

    <line x1="1104" y1="168" x2="1176" y2="140" stroke="#a9b8d4" stroke-opacity="0.6" stroke-width="2"/>
    <line x1="1104" y1="168" x2="1176" y2="206" stroke="#a9b8d4" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="1176" y="122" width="36" height="36" rx="7" fill="#1b3354" stroke="#a9b8d4" stroke-opacity="0.7"/>
    <text x="1194" y="117" font-size="13" fill="#a9b8d4" text-anchor="middle">client-b</text>
    <rect x="1176" y="188" width="36" height="36" rx="7" fill="#1b3354" stroke="#60a5fa" stroke-opacity="0.9"/>
    <text x="1194" y="244" font-size="13" fill="#a9b8d4" text-anchor="middle">dc02</text>
  </g>
</svg>
